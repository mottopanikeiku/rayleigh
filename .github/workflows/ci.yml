name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Regenerate and compare committed results, figures, hero and example
        run: uv run python scripts/check_results.py
      - run: uv run python examples/plan_from_pilot.py
      - name: Install the wheel in a clean environment and run the CLI example
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env" "$RUNNER_TEMP"/dist/eval_power-*.whl
          cd "$RUNNER_TEMP"
          wheel-env/bin/rayleigh --difference 0.05 \
            --pilot "$GITHUB_WORKSPACE/examples/gsm8k_qwen7_phi35_pilot.csv" > plan.json
          grep -F '"bound_items_per_model": 787' plan.json
          wheel-env/bin/python -c "import eval_power; assert 'site-packages' in eval_power.__file__"
